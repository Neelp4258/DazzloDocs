<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HTML to PDF Converter</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <h1>HTML → PDF Converter</h1>
      <p class="subtitle">Client-side, supports portrait/landscape, sizes, margins, and more.</p>
    </header>

    <main class="container">
      <section class="controls">
        <div class="field">
          <label for="filename">File name</label>
          <input id="filename" type="text" value="document.pdf" placeholder="document.pdf">
        </div>

        <div class="grid">
          <div class="field">
            <label for="orientation">Orientation</label>
            <select id="orientation">
              <option value="portrait" selected>Portrait</option>
              <option value="landscape">Landscape</option>
            </select>
          </div>

          <div class="field">
            <label for="pageSize">Page size</label>
            <select id="pageSize">
              <option value="a4" selected>A4</option>
              <option value="letter">Letter</option>
              <option value="legal">Legal</option>
              <option value="a3">A3</option>
              <option value="a5">A5</option>
              <option value="tabloid">Tabloid</option>
              <option value="executive">Executive</option>
            </select>
          </div>

          <div class="field">
            <label for="margin">Margins</label>
            <select id="margin">
              <option value="0.25in">Narrow (0.25in)</option>
              <option value="0.5in" selected>Normal (0.5in)</option>
              <option value="1in">Wide (1in)</option>
            </select>
          </div>

          <div class="field">
            <label for="scale">Scale</label>
            <input id="scale" type="range" min="0.5" max="2" step="0.05" value="1">
            <small id="scaleValue">1.00x</small>
          </div>
        </div>

        <div class="field">
          <label for="htmlInput">HTML content</label>
          <textarea id="htmlInput" rows="10" placeholder="Enter or paste your HTML here"></textarea>
        </div>

        <div class="actions">
          <button id="loadSample" type="button">Load sample</button>
          <button id="previewBtn" type="button">Preview</button>
          <button id="downloadBtn" class="primary" type="button">Download PDF</button>
        </div>
      </section>

      <section class="preview">
        <h2>Preview</h2>
        <iframe id="previewFrame" title="Preview" sandbox="allow-same-origin" referrerpolicy="no-referrer"></iframe>
      </section>
    </main>

    <footer class="app-footer">
      <span>Powered by html2pdf.js (html2canvas + jsPDF)</span>
      <a href="https://github.com/eKoopmans/html2pdf.js" target="_blank" rel="noreferrer">Project</a>
    </footer>

    <!-- html2pdf.js via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
  </html>
